# ============================================
# VisionX — Alembic configuration
# ============================================
# The database URL is deliberately NOT set here. `alembic/env.py` resolves it
# through `server.db.session.resolve_database_url()`, so migrations obey the
# same fail-closed rule as the application: production without DATABASE_URL is
# a startup error, never a guess at localhost.
#
# Usage:
#   alembic upgrade head              # migrate the configured database
#   alembic downgrade -1              # step back one revision
#   alembic revision --autogenerate -m "add x"
#   alembic -x url=sqlite:///tmp.db upgrade head   # explicit override

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Keep revision filenames sortable and readable: 0001_initial_schema.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
