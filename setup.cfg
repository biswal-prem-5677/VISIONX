[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# The database layer is async end to end, so its tests are too. "auto" means an
# async test needs no per-test marker; "function" scope gives every test its own
# event loop, so a session that fails mid-transaction cannot poison the next one.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

[flake8]
max-line-length = 120
exclude = .venv,__pycache__,build,dist
